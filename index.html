<head>

<title>For Abhishek 🤝</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1e3a8a, #0f172a);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .page {
    width: 100%;
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
  }
  .page.active { display: flex; }
  .card {
    width: min(92vw, 520px);
    padding: 35px 25px;
    border-radius: 28px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.20);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    backdrop-filter: blur(10px);
  }
  h1 { font-size: clamp(28px, 7vw, 48px); margin: 0 0 15px; }
  p { font-size: 20px; line-height: 1.5; }
  .buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 18px;
    min-height: 58px;
    position: relative;
  }
  button {
    border: 0;
    padding: 15px 28px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
  }
  #yes { background: #22c55e; color: white; }
  #no { background: #ef4444; color: white; position: relative; }
  button:hover { transform: scale(1.06); }
  .heart { font-size: 60px; animation: pulse 1.2s infinite; }
  @keyframes pulse {
    50% { transform: scale(1.15); }
  }
  .photo {
    width: 100%;
    max-height: 55vh;
    object-fit: contain;
    border-radius: 20px;
    margin-top: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,.5);
  }
  .small { opacity: .8; font-size: 15px; margin-top: 18px; }
</style>
</head>

  const maxY = Math.max(padding, window.innerHeight - noBtn.offsetHeight - padding);
  noBtn.style.position = "fixed";
  noBtn.style.left = Math.floor(Math.random() * maxX) + "px";
  noBtn.style.top = Math.floor(Math.random() * maxY) + "px";
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNoButton();
});
noBtn.addEventListener("click", moveNoButton);

function showSecondPage() {
  document.getElementById("page1").classList.remove("active");
  document.getElementById("page2").classList.add("active");
  noBtn.style.display = "none";
}
</script>
</body>
</html>
